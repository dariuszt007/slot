<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎰 スロットマシン 🎰</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;

    background:
    radial-gradient(circle at top,
    #ff0080 0%,
    #8a00ff 40%,
    #001133 100%);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:15px;
    color:white;
}

.container{
    width:100%;
    max-width:500px;
}

.machine{

    background:rgba(0,0,0,.35);

    border:5px solid gold;

    border-radius:30px;

    padding:20px;

    animation:rainbowGlow 3s infinite linear;
}

@keyframes rainbowGlow{

    0%{
        box-shadow:0 0 20px red;
    }

    25%{
        box-shadow:0 0 20px yellow;
    }

    50%{
        box-shadow:0 0 20px lime;
    }

    75%{
        box-shadow:0 0 20px cyan;
    }

    100%{
        box-shadow:0 0 20px red;
    }
}

h1{

    text-align:center;

    color:#ffd700;

    margin-bottom:25px;

    text-shadow:
    0 0 10px #ffd700,
    0 0 20px orange,
    0 0 40px red;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:18px;
    font-weight:bold;
}

input{

    width:100%;
    height:60px;

    border:none;

    border-radius:15px;

    font-size:24px;

    text-align:center;
}

.buttons{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:15px;
}

button{

    border:none;

    border-radius:18px;

    height:75px;

    color:white;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;
}

.start-btn{

    background:
    linear-gradient(#00ff66,#009933);

    box-shadow:
    0 0 15px #00ff66,
    0 0 30px #00ff66;
}

.stop-btn{

    background:
    linear-gradient(#ff5555,#cc0000);

    box-shadow:
    0 0 15px #ff4444,
    0 0 30px #ff4444;
}

.reset-btn{

    width:100%;

    margin-top:12px;

    background:
    linear-gradient(#00cfff,#0055ff);

    box-shadow:
    0 0 15px #00cfff,
    0 0 30px #00cfff;
}

.display{

    margin-top:25px;

    min-height:220px;

    background:black;

    border:6px solid gold;

    border-radius:25px;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    text-align:center;

    overflow-wrap:anywhere;

    box-shadow:
    inset 0 0 25px red,
    0 0 20px gold;
}

.number{

    color:#00ff66;

    font-size:52px;

    font-weight:bold;

    line-height:1.4;

    text-shadow:
    0 0 10px #00ff66,
    0 0 20px #00ff66,
    0 0 40px #00ff66;
}

.footer{

    margin-top:15px;

    text-align:center;

    color:#ffd700;
}

@media(max-width:600px){

    h1{
        font-size:30px;
    }

    .number{
        font-size:40px;
    }

    button{
        height:80px;
        font-size:26px;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="machine">

<h1>🎰 スロットマシン 🎰</h1>

<div class="form-group">
<label>数字の数</label>
<input id="count" type="number" min="1" value="3">
</div>

<div class="form-group">
<label>最小値</label>
<input id="min" type="number" value="1">
</div>

<div class="form-group">
<label>最大値</label>
<input id="max" type="number" value="40">
</div>

<div class="buttons">

<button class="start-btn" onclick="startSlot()">
スタート
</button>

<button class="stop-btn" onclick="stopSlot()">
ストップ
</button>

</div>

<button class="reset-btn" onclick="resetSlot()">
リセット
</button>

<div class="display">
<div class="number" id="slot">
0 1 2
</div>
</div>

<div class="footer">
✨ Pachinko Style Edition ✨
</div>

</div>

</div>

<script>

let interval = null;

function generateNumbers(){

    const count =
    parseInt(document.getElementById("count").value);

    const min =
    parseInt(document.getElementById("min").value);

    const max =
    parseInt(document.getElementById("max").value);

    if(max < min){
        return "ERROR";
    }

    const range =
    max - min + 1;

    const finalCount =
    Math.min(count, range);

    let available = [];

    for(let i=min;i<=max;i++){
        available.push(i);
    }

    let result = [];

    for(let i=0;i<finalCount;i++){

        const randomIndex =
        Math.floor(
        Math.random()*available.length
        );

        result.push(
        available[randomIndex]
        );

        available.splice(
        randomIndex,
        1
        );
    }

    return result.join("  ");
}

function startSlot(){

    if(interval) return;

    interval = setInterval(()=>{

        document.getElementById("slot")
        .textContent =
        generateNumbers();

    },60);
}

function stopSlot(){

    clearInterval(interval);

    interval = null;

    document.getElementById("slot")
    .textContent =
    generateNumbers();
}

function resetSlot(){

    clearInterval(interval);

    interval = null;

    document.getElementById("slot")
    .textContent =
    "-";
}

</script>

</body>
</html>
